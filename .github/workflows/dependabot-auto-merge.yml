name: Dependabot Auto-merge

# Gated auto-merge enablement for Dependabot pull requests, adapted from
# the monorepo fleet template (the monorepo tooling plane is replaced by
# branch protection: only a PR satisfying every required check completes
# a --auto merge, and a red PR stays open). The author gate keeps every
# non-Dependabot pull request out of this workflow: automerge.yml remains
# the human-plane enablement path (one implementation per plane). Draft
# pull requests are refused: auto-merge never arms on a draft. Every
# merge command in this file carries --auto; a bare merge could fire on
# a red pull request and is forbidden.

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: read

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependabot-auto-merge:
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      !github.event.pull_request.draft
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Check auto-merge state
        id: state
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: >-
          enabled="$(gh pr view '${{ github.event.pull_request.number }}'
          --repo '${{ github.repository }}' --json autoMergeRequest
          --jq '.autoMergeRequest != null')";
          echo "already_enabled=${enabled}" >> "${GITHUB_OUTPUT}"

      - name: Enable auto-merge (squash)
        if: steps.state.outputs.already_enabled == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: >-
          gh pr merge --auto --squash
          --repo '${{ github.repository }}'
          '${{ github.event.pull_request.number }}'
