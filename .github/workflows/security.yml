# Secret-scanning enforcement (house rule: no secret-shaped material in
# code or history, ever). Additive to ci.yml - do not merge the two.
name: security

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks full-history scan
    runs-on: ubuntu-latest
    steps:
      - name: checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: install pinned gitleaks v8.30.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          grep 'linux_x64.tar.gz' gitleaks_8.30.1_checksums.txt | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz -C "$RUNNER_TEMP/bin" gitleaks
          "$RUNNER_TEMP/bin/gitleaks" version

      - name: gitleaks detect (full history, redacted)
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/bin/gitleaks" detect --source . --redact --verbose
